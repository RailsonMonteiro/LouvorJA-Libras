appId: org.louvorja.libras
productName: LouvorJA Libras
directories:
  output: release/${version}
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  target: [dmg]
  category: public.app-category.education
linux:
  target: [AppImage, deb]
  category: Education
# Distribution is free: no code signing, licensing or update server is configured yet.
publish: null
